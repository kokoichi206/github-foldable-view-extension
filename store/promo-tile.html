<!doctype html>
<!-- Chrome Web Store の小プロモタイル (440x280) の生成元。PNG は `pnpm assets` で作り直す。
     図案は icons/icon.svg と揃えること。角丸背景だけはタイル自身の地色が担うため持たない -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 440px;
        height: 280px;
        box-sizing: border-box;
        padding: 0 40px;
        display: flex;
        align-items: center;
        gap: 28px;
        background: #1f2328;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #e6edf3;
      }
      .mark {
        flex: none;
        width: 108px;
        height: 108px;
      }
      h1 {
        margin: 0;
        font-size: 29px;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.01em;
      }
      p {
        margin: 12px 0 0;
        font-size: 13px;
        line-height: 1.45;
        color: #9198a1;
      }
    </style>
  </head>
  <body>
    <svg class="mark" viewBox="24 24 80 80" xmlns="http://www.w3.org/2000/svg">
      <rect x="32" y="31" width="64" height="12" rx="6" fill="#e6edf3" />
      <path
        d="M43 55 L64 73 L85 55"
        fill="none"
        stroke="#58a6ff"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <rect x="32" y="85" width="48" height="12" rx="6" fill="#e6edf3" />
    </svg>
    <div>
      <h1>Foldable View<br />for GitHub</h1>
      <p>Fold source files by indent, right in the GitHub file view.</p>
    </div>
  </body>
</html>
